{% extends 'base.html' %}
{% block title %} Add Budget {% endblock %}

{% block content %}
    <div class="container">
        <h1>{% if form.instance.pk %}Edit Budget{% else %}New Budget{% endif %}</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-success" type="submit">{% if form.instance.pk %}Submit and save{% else %}Create and save{% endif %}</button>
        </form>
    </div>
{% endblock %}

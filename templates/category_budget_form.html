{% extends 'base.html' %}
{% block title %}Edit Category Budget`{% endblock %}

{% block content %}
<div class="container mt-4">

    <h1 class="mb-3">
        {% if form.instance.pk %}
            Edit Category Budget
        {% endif %}
    </h1>

    <form method="post" class="card p-4 shadow-sm">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn btn-success mt-3" type="submit">
            {% if form.instance.pk %}
                Save Changes
            {% else %}
                Create Category
            {% endif %}
        </button>
    </form>

</div>
{% endblock %}
